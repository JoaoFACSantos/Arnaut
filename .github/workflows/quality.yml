name: Verificar qualidade

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar JavaScript
        run: npm run lint

      - name: Verificar tipos do frontend
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar funções Supabase
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Analisar funções Supabase
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Confirmar formatação das funções
        run: deno fmt --check --config supabase/functions/deno.json supabase/functions
